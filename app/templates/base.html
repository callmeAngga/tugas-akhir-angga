<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEA Rooftop PV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    {% block head %}{% endblock %}
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface-2: #1c2230;
            --border: #262d3a;
            --text: #e6edf3;
            --text-dim: #8b98a9;
            --accent: #2f81f7;
            --accent-2: #00d4ff;
            --good: #3fb950;
            --warn: #f0883e;
            --radius: 10px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 15px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3 { font-family: 'Sora', sans-serif; letter-spacing: -0.02em; }
        a { color: inherit; text-decoration: none; }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 58px;
            padding: 0 28px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 18px;
        }
        .brand .logo {
            width: 28px; height: 28px;
            display: grid; place-items: center;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff; font-size: 15px;
        }
        .brand small {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            color: var(--text-dim);
            font-size: 12px;
            letter-spacing: 0;
        }
        .topbar .tag {
            font-size: 12px;
            color: var(--text-dim);
            border: 1px solid var(--border);
            padding: 5px 12px;
            border-radius: 999px;
        }

        .page { width: 100%; padding: 24px 28px 40px; }

        .flash {
            background: rgba(240,136,62,.12);
            border: 1px solid rgba(240,136,62,.4);
            color: var(--warn);
            padding: 12px 18px;
            border-radius: var(--radius);
            margin-bottom: 18px;
            font-size: 14px;
        }

        .btn {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 15px;
            border: none;
            border-radius: var(--radius);
            padding: 14px 22px;
            cursor: pointer;
            transition: filter .15s, transform .05s;
        }
        .btn:active { transform: translateY(1px); }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
        }
        .btn-primary:hover { filter: brightness(1.08); }
        .btn-ghost {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: .04em;
        }
        .field input, .field select {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: 11px 12px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            width: 100%;
        }
        .field input:focus, .field select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(47,129,247,.2);
        }
        .field .hint { font-size: 11px; color: var(--text-dim); }

        .muted { color: var(--text-dim); }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="{{ url_for('landing') }}" class="brand">
            <span>Techno Economic Assessment</span>
        </a>
    </header>

    <main class="page">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
